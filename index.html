<!DOCTYPE html>
<html lang="hak-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客語海陸腔互動教材 - 日期與天氣</title>
<style>
  :root { --main:#16a085; --dark:#2c3e50; --mid:#34495e; }
  * { box-sizing: border-box; }
  body {
    font-family: "GenSenRounded TW", "源泉圓體 TW", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background:#f4f7f6; margin:0; padding:20px;
    display:flex; flex-direction:column; align-items:center;
  }
  h1 { color:var(--dark); font-size:clamp(1.6rem,4vw,2.5rem); border-bottom:4px solid var(--main); padding-bottom:10px; margin:0 0 30px; text-align:center; }
  .container { width:100%; max-width:1050px; display:flex; flex-direction:column; gap:30px; }
  .card { background:#fff; padding:28px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,.1); border-left:8px solid var(--main); }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:15px; }
  .card-title { font-size:1.2rem; color:#7f8c8d; font-weight:bold; }
  .sentence { font-size:clamp(2rem,6vw,3.5rem); font-weight:bold; color:#34495e; display:flex; align-items:center; flex-wrap:wrap; gap:12px; line-height:1.5; }

  /* 可選的黑色字框:兩字以上自動直排 */
  .slot {
    font:inherit; color:#fff; background:var(--dark); border:4px solid var(--dark); border-radius:10px;
    min-width:90px; min-height:90px; padding:6px 18px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; transition:transform .2s, background .2s;
  }
  .slot:hover, .slot:focus-visible { background:var(--mid); transform:scale(1.05); outline:3px solid #f1c40f; }
  .slot.vertical .txt { writing-mode:vertical-rl; text-orientation:upright; line-height:1.15; }
  .slot::after { content:"▾"; font-size:.35em; margin-left:6px; opacity:.7; }

  .play {
    font:inherit; font-size:1.1rem; border:none; border-radius:999px; padding:10px 22px;
    background:var(--main); color:#fff; cursor:pointer; font-weight:bold;
  }
  .play:hover { filter:brightness(1.1); }
  .play.playing { background:#e67e22; }
  .question { display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:clamp(1.3rem,3.5vw,1.9rem); font-weight:bold; color:var(--main); margin-bottom:14px; }
  .question .play { font-size:.9rem; padding:6px 14px; }
  .hint { font-size:.95rem; color:#95a5a6; margin-top:14px; }
  .head-right { display:flex; align-items:center; gap:10px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
  .note { font-size:1rem; font-weight:bold; color:#c0392b; background:#fdecea; border:2px solid #c0392b; border-radius:999px; padding:6px 14px; }
  .note:empty { display:none; }

  /* 選擇面板 */
  #picker { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #picker.open { display:flex; }
  #picker .panel { background:#fff; border-radius:16px; padding:22px; max-width:640px; width:100%; max-height:85vh; overflow:auto; }
  #picker h2 { margin:0 0 14px; font-size:1.2rem; color:var(--dark); }
  #picker .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:10px; }
  #picker .opt { font:inherit; font-size:1.8rem; font-weight:bold; padding:14px 6px; border-radius:10px; border:3px solid var(--dark); background:#fff; color:var(--dark); cursor:pointer; }
  #picker .opt:hover, #picker .opt:focus-visible { background:var(--dark); color:#fff; }
  #picker .opt.current { background:var(--main); border-color:var(--main); color:#fff; }
  #picker .close { margin-top:14px; font:inherit; padding:8px 18px; border-radius:8px; border:1px solid #bbb; background:#f4f4f4; cursor:pointer; }

  footer { margin-top:30px; font-size:.9rem; color:#7f8c8d; text-align:center; }
</style>
</head>
<body>

<h1>日期 天時 互動教材</h1>

<div class="container">

  <section class="card" data-card="date">
    <div class="card-head">
      <div class="card-title">句型練習(日期)</div>
      <div class="head-right">
        <span class="note" id="n-date" role="status"></span>
        <button class="play" data-replay="date">🔊 唸一擺</button>
      </div>
    </div>
    <div class="question"><span>問：今晡日係拜幾？</span><button class="play" data-q="date">🔊 聽問句</button></div>
    <div class="sentence" id="s-date"></div>
    <div class="hint">* 點黑色框框選主詞和星期,選好就會唸出來。</div>
  </section>

  <section class="card" data-card="weather">
    <div class="card-head">
      <div class="card-title">句型練習(天氣)</div>
      <div class="head-right">
        <span class="note" id="n-weather" role="status"></span>
        <button class="play" data-replay="weather">🔊 唸一擺</button>
      </div>
    </div>
    <div class="question"><span>問：今晡日天時仰般？</span><button class="play" data-q="weather">🔊 聽問句</button></div>
    <div class="sentence" id="s-weather"></div>
    <div class="hint">* 點黑色框框選天氣,選好就會唸出來。</div>
  </section>

  <section class="card" data-card="time">
    <div class="card-head">
      <div class="card-title">句型練習(時間)</div>
      <div class="head-right">
        <span class="note" id="n-time" role="status"></span>
      </div>
    </div>
    <div class="question"><span>問：這下幾多點？</span></div>
    <div class="sentence" id="s-time"></div>
    <div class="hint">* 點黑色框框選小時(1–12)和分鐘(00–59)。</div>
  </section>

</div>

<div id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
  <div class="panel">
    <h2 id="picker-title"></h2>
    <div class="grid" id="picker-grid"></div>
    <button class="close" id="picker-close">取消</button>
  </div>
</div>

/* ---------- 內容資料(改字、加選項只改這裡) ---------- */
const DAYS    = ["今晡日", "昨晡日", "韶早"];
const WEEKS   = ["一", "二", "三", "四", "五", "六", "日"];
const WEATHER = ["熱", "冷", "涼", "燒暖", "好", "濕", "翕"];
const HOURS   = Array.from({length: 12}, (_, i) => String(i + 1));
const MINUTES = Array.from({length: 60}, (_, i) => String(i).padStart(2, "0"));

const state = { day: 0, week: 0, weather: 0, hour: 0, minute: 0 };

/* ---------- 音檔規則 ----------
   日期:整句一個檔  date_<主詞編號>_<星期編號>.mp3   例:date_0_4.mp3 = 今晡日係拜五
   天氣:整句一個檔  weather_<編號>.mp3                 例:weather_3.mp3 = 今晡日天時當燒暖
   問句:q_date.mp3(今晡日係拜幾?)、q_weather.mp3(今晡日天時仰般?);時間的問句不做音檔
   時間:兩段接著唸  hour_<1-12>.mp3(這下係N點)+ min_<00-59>.mp3(N分)
   整句錄音比逐字接起來自然,語調才不會斷斷續續。 */
function clipsFor(card) {
  if (card === "date")    return [`date_${state.day}_${state.week}.mp3`];
  if (card === "weather") return [`weather_${state.weather}.mp3`];
  return [`hour_${HOURS[state.hour]}.mp3`, `min_${MINUTES[state.minute]}.mp3`];
}

/* ---------- 播放(同一個 Audio 物件反覆使用,手機瀏覽器比較不會擋) ---------- */
const player = new Audio();
let playToken = 0;
function playCard(card, files) {
  const token = ++playToken;
  const queue = (files || clipsFor(card)).slice();
  const note = document.getElementById("n-" + card);
  note.textContent = "";
  document.querySelectorAll(".play").forEach(b => b.classList.remove("playing"));
  const btn = document.querySelector(files ? `[data-q="${card}"]` : `[data-replay="${card}"]`) || document.createElement("span");
  const next = () => {
    if (token !== playToken) return;
    if (!queue.length) { btn.classList.remove("playing"); return; }
    player.src = AUDIO[queue.shift()];
    player.onended = next;
    player.onerror = () => { btn.classList.remove("playing"); note.textContent = "請去查字典看這兜數字愛仰般讀。"; };
    btn.classList.add("playing");
    player.play().catch(() => { btn.classList.remove("playing"); });
  };
  player.pause();
  next();
}

/* ---------- 畫面 ---------- */
function slot(label, items, key, card) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "slot";
  b.setAttribute("aria-label", label + ":" + items[state[key]]);
  const t = document.createElement("span");
  t.className = "txt";
  t.textContent = items[state[key]];
  b.appendChild(t);
  if (key !== "day" && items[state[key]].length > 1 && !/^\d+$/.test(items[state[key]])) b.classList.add("vertical");   // 日期的主詞(今晡日等)橫排
  b.addEventListener("click", () => openPicker(label, items, key, card));
  return b;
}
function text(s) { const e = document.createElement("span"); e.textContent = s; return e; }

function render() {
  const d = document.getElementById("s-date");
  d.replaceChildren(slot("主詞", DAYS, "day", "date"), text("係"), text("拜"), slot("星期", WEEKS, "week", "date"));
  const w = document.getElementById("s-weather");
  w.replaceChildren(text("今晡日"), text("天時當"), slot("天氣", WEATHER, "weather", "weather"));
  const t = document.getElementById("s-time");
  const whole = MINUTES[state.minute] === "00";   // 整點:不接「分」,改接「整」
  t.replaceChildren(text("這下係"), slot("小時", HOURS, "hour", "time"), text("點"),
    slot("分鐘", MINUTES, "minute", "time"), text(whole ? "整" : "分"));
}

/* ---------- 選擇面板 ---------- */
const picker = document.getElementById("picker");
let lastFocus = null;
function openPicker(label, items, key, card) {
  lastFocus = document.activeElement;
  document.getElementById("picker-title").textContent = "選" + label;
  const grid = document.getElementById("picker-grid");
  grid.replaceChildren();
  items.forEach((v, i) => {
    const o = document.createElement("button");
    o.type = "button";
    o.className = "opt" + (i === state[key] ? " current" : "");
    o.textContent = v;
    o.addEventListener("click", () => {
      state[key] = i;
      closePicker();
      render();
      playCard(card);
    });
    grid.appendChild(o);
  });
  picker.classList.add("open");
  (grid.querySelector(".current") || grid.firstChild).focus();
}
function closePicker() { picker.classList.remove("open"); if (lastFocus) lastFocus.focus?.(); }
document.getElementById("picker-close").addEventListener("click", closePicker);
picker.addEventListener("click", e => { if (e.target === picker) closePicker(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && picker.classList.contains("open")) closePicker(); });
document.querySelectorAll("[data-replay]").forEach(b => b.addEventListener("click", () => playCard(b.dataset.replay)));
document.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => playCard(b.dataset.q, [`q_${b.dataset.q}.mp3`])));

render();
</script>
</body>
</html>
